openapi: 3.0.3
info:
  title: Cycling Equipment API
  description: >
    The API documentation for tracking cycling equipment - derived reports.
    Mileage is computed server-side from tours covered by mounting
    intervals (domain model §5). Mutating requests (POST/PUT/PATCH/DELETE)
    return 401 when the edit gate is enabled and no valid credential is
    presented (CE-0118).
  version: 2.0.0
  license:
    name: (c) CyclingSir
  contact:
    name: CyclingSir
    url: https://github.com/cyc1ingsir
servers:
  - url: http://localhost:8080/{basePath}
    description: the default server url
    variables:
      basePath:
        default: api
tags:
  - name: Reports
    description: Derived reports over equipment usage

paths:
  /reports/mileage:
    get:
      operationId: getMileageReport
      description: >
        Mileage rows derived from tours: for scope=components (default) one row
        per component, summing the tours whose whole interval [startedAt,
        startedAt + elapsed) is covered by one of the component's mountings on
        the tour's bike (domain-model.md §5 - a mid-tour swap counts the tour
        for neither component). Optionally restricted to one component, one
        bike, and/or a time frame. For scope=bikes one total row per bike
        (with componentId: that component's per-bike breakdown). Time frame
        filters tours by their start time; from/to are optional and independent
        ("this year", "A to B", "A to now"). A tour without duration data
        (zero-width interval) counts when a mounting spans its startedAt.
        Empty list when nothing matches.
        Known gap: no pagination yet.
      tags:
        - Reports
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - components
              - bikes
            default: components
        - name: componentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: bikeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: o.k.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MileageReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reports/tours:
    get:
      tags:
        - Reports
      operationId: getTourReport
      description: >
        Per-time-bucket x per-bike tour aggregates for the report bar chart
        (CE-0127). Tours are bucketed by their startYear/startMonth (the
        rider-local calendar as reported by tour-api), not by the UTC instant of
        startedAt. Buckets with no tours are omitted; the client fills the axis
        from granularity/endYear/yearsBack and renders the gaps as zero. All
        three metrics are always returned so the client can switch metrics
        without refetching. Always 200 with a JSON object - an empty range
        yields buckets: []; never 204. The response is bounded by
        yearsBack <= 20 (at most 240 buckets), so no pagination is needed.
      parameters:
        - name: granularity
          in: query
          required: false
          description: Bucket width. Unknown values are rejected with 400.
          schema:
            type: string
            enum: [month, year]
            default: month
        - name: endYear
          in: query
          required: false
          description: >
            Last (most recent) year included. Defaults to the newest year that
            has tours, so the first request needs no prior knowledge; that year
            is always present in availableYears.
          schema:
            type: integer
            format: int16
            minimum: 1970
            maximum: 2200
        - name: yearsBack
          in: query
          required: false
          description: >
            Number of years covered, counting back from and including endYear:
            startYear = endYear - yearsBack + 1. month granularity yields
            yearsBack x 12 buckets.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
      responses:
        '200':
          description: o.k.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: './common-api.yaml#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: './common-api.yaml#/components/schemas/Error'
  schemas:
    MileageItem:
      type: object
      description: >
        One mileage row. For scope=components the component identity fields are
        set; for scope=bikes the bike fields. Carries raw identity fields so
        the client composes the display identity with the same rule used
        elsewhere.
      required:
        - distance
        - durationMoving
        - ascent
        - descent
      properties:
        componentId:
          type: string
          format: uuid
          description: set for scope=components
        label:
          type: string
          description: the component's label (scope=components)
        manufacturer:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        bikeId:
          type: string
          format: uuid
          description: set for scope=bikes; for scope=components with bikeId filter, the restricting bike
        bikeName:
          type: string
          description: set for scope=bikes; may be empty when the bike has no name
        bikeModel:
          type: string
          description: set for scope=bikes; bike display identity is name, else model (same rule as elsewhere)
        distance:
          type: integer
          format: int64
          description: total distance of usage in meters
        durationMoving:
          type: integer
          format: int64
          description: total time of usage (moving) in seconds
        ascent:
          type: integer
          format: int64
          description: total altitude climbed in meters
        descent:
          type: integer
          format: int64
          description: accumulated descent in meters
        powerTotal:
          type: integer
          format: int64
          description: total power in joules
    MileageReport:
      type: array
      items:
        $ref: '#/components/schemas/MileageItem'
    TourReport:
      type: object
      description: >
        Chart-shaped projection: a series list (bikes) plus the buckets that
        stack over it.
      required:
        - availableYears
        - bikes
        - buckets
      properties:
        availableYears:
          type: array
          uniqueItems: true
          description: >
            Every year with at least one tour, newest first, independent of the
            requested range; drives the end-year picker.
          items:
            type: integer
            format: int16
        bikes:
          type: array
          description: >
            One entry per bike having at least one tour inside the requested
            range, in the order the client stacks segments and lists the legend.
            Bikes with no tours in the range are absent. The Unassigned entry
            (bikeId absent) is last and present only if such tours exist.
          items:
            $ref: '#/components/schemas/TourReportBike'
        buckets:
          type: array
          description: ascending by year, then month
          items:
            $ref: '#/components/schemas/TourReportBucket'
    TourReportBike:
      type: object
      description: >
        Series identity. Carries raw identity fields so the client composes the
        display identity with the same rule used elsewhere.
      properties:
        bikeId:
          type: string
          format: uuid
          description: >
            absent for the Unassigned series - tours with no bike; at most one
            such entry (defensive: tour.bike_id is currently mandatory)
        bikeName:
          type: string
          description: may be empty when the bike has no name
        bikeModel:
          type: string
          description: bike display identity is name, else model (same rule as elsewhere)
    TourReportBucket:
      type: object
      required:
        - year
        - items
      properties:
        year:
          type: integer
          format: int16
        month:
          type: integer
          format: int16
          minimum: 1
          maximum: 12
          description: >
            set for granularity=month only; omitted (not null) for
            granularity=year
        items:
          type: array
          description: >
            one entry per contributing bike, in the order of the top-level bikes
            list; bikes with no tours in this bucket are omitted
          items:
            $ref: '#/components/schemas/TourReportItem'
    TourReportItem:
      type: object
      description: aggregates of one bike's tours inside one bucket
      required:
        - distance
        - ascent
        - durationMoving
      properties:
        bikeId:
          type: string
          format: uuid
          description: absent for the Unassigned series; joins to TourReportBike
        distance:
          type: integer
          format: int64
          minimum: 0
          description: total distance in meters
        ascent:
          type: integer
          format: int64
          minimum: 0
          description: total altitude climbed in meters
        durationMoving:
          type: integer
          format: int64
          minimum: 0
          description: total time moving in seconds
